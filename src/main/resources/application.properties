# Require4Testing - Datenbankverbindung (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/require4testing?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate erstellt/aktualisiert fehlende Tabellen automatisch
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Thymeleaf: im Entwicklungsbetrieb Cache deaktivieren
spring.thymeleaf.cache=false

server.port=8080

# ---------------------------------------------------------------------
# Alternative ohne lokalen MySQL-Server: H2 In-Memory-Datenbank.
# Zum Aktivieren die vier Zeilen oben (spring.datasource.*) auskommentieren
# und die folgenden vier Zeilen aktivieren:
# spring.datasource.url=jdbc:h2:mem:require4testing
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
