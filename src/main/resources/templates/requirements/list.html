<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Anforderungen')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Anforderungen</h1>
        <a class="btn btn-primary" th:href="@{/requirements/new}">+ Neue Anforderung</a>
    </div>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Titel</th>
            <th>Beschreibung</th>
            <th>Status</th>
            <th>Erstellungsdatum</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${requirements}">
            <td th:text="${r.title}">Titel</td>
            <td th:text="${r.description}">Beschreibung</td>
            <td><span class="badge bg-secondary" th:text="${r.status.displayName}">Status</span></td>
            <td th:text="${#temporals.format(r.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</td>
            <td>
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/testcases(reqId=${r.id})}">Testfälle</a>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/requirements/{id}/edit(id=${r.id})}">Bearbeiten</a>
                <form th:action="@{/requirements/{id}/delete(id=${r.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Anforderung wirklich löschen? Alle zugehörigen Testfälle werden mitgelöscht.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${requirements.isEmpty()}">
            <td colspan="5" class="text-muted text-center">Noch keine Anforderungen angelegt.</td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
