<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(title='Testfälle')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">Testfälle</h1>
            <p class="text-muted mb-0">Anforderung: <span th:text="${requirement.title}">Titel</span></p>
        </div>
        <a class="btn btn-primary" th:href="@{/testcases/new(reqId=${requirement.id})}">+ Neuer Testfall</a>
    </div>

    <div class="alert alert-danger" th:if="${param.error != null}" th:text="${param.error[0]}">Fehler</div>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>Titel</th>
            <th>Testschritte</th>
            <th>Erwartetes Ergebnis</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tc : ${testCases}">
            <td th:text="${tc.title}">Titel</td>
            <td th:text="${tc.steps}" style="white-space: pre-line;">Schritte</td>
            <td th:text="${tc.expectedResult}">Ergebnis</td>
            <td>
                <form th:action="@{/testcases/{id}/delete(id=${tc.id},reqId=${requirement.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Testfall wirklich löschen?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Löschen</button>
                </form>
            </td>
        </tr>
        <tr th:if="${testCases.isEmpty()}">
            <td colspan="4" class="text-muted text-center">Noch keine Testfälle zu dieser Anforderung.</td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/requirements}" class="btn btn-secondary">Zurück zu den Anforderungen</a>
</div>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
