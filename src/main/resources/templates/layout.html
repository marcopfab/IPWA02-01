<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Gemeinsames Layout-Fragment: stellt Kopf (head), Navigation (nav) und
  Fußzeile (footer) für alle anderen Templates bereit. Einbindung über
  th:replace="~{layout :: <fragment>}" in den jeweiligen Seiten.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' – Require4Testing'">Require4Testing</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/requirements}">Require4Testing</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/requirements}">Anforderungen</a>
            <a class="nav-link" th:href="@{/testruns}">Testläufe</a>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="text-muted text-center small mt-5 mb-4">
    Require4Testing &middot; Fallstudie IPWA02-01 &middot; Prototyp Sprint 1
</footer>

</body>
</html>
